name: StitchFlow Release Builds

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Build flavor (dev, prod, or both)'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - dev
          - prod

jobs:
  android_apk:
    name: Android APK (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        flavor: [dev, prod]
    if: github.event_name != 'workflow_dispatch' || inputs.flavor == 'both' || inputs.flavor == matrix.flavor
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android ${{ matrix.flavor }} release APK
        run: |
          flutter build apk --release \
            --flavor ${{ matrix.flavor }} \
            -t lib/main_${{ matrix.flavor }}.dart \
            --dart-define-from-file=config/${{ matrix.flavor }}.json

      - name: Upload Android ${{ matrix.flavor }} APK
        uses: actions/upload-artifact@v4
        with:
          name: stitchflow-android-${{ matrix.flavor }}-apk
          path: build/app/outputs/flutter-apk/app-${{ matrix.flavor }}-release.apk
          retention-days: 30

  windows_release:
    name: Windows Release Bundle
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows prod release
        run: |
          flutter build windows --release `
            -t lib/main_prod.dart `
            --dart-define-from-file=config/prod.json

      - name: Upload Windows release bundle
        uses: actions/upload-artifact@v4
        with:
          name: stitchflow-windows-prod
          path: build/windows/x64/runner/Release/
          retention-days: 30
