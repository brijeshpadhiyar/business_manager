name: business_manager
description: "Offline-first multi-platform Flutter Business Management System (Business Manager / બિઝનેસ મેનેજર)."
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Official decoupled Flutter Material 3 library (flutter.dev)
  material_ui: ^1.11.1
  cupertino_icons: ^2.0.0

  # State management
  flutter_bloc: ^9.1.1

  # Local offline database (SQLite + Drift)
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  sqlite3: ^3.9.1

  # Declarative navigation
  go_router: ^18.1.4

  # Models & JSON serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Dependency injection
  get_it: ^9.3.0
  injectable: ^3.0.0

  # Localization, dates & formatting
  intl: ^0.20.3
  timezone: ^0.11.2

  # Local persistence, files, media & backup
  shared_preferences: ^2.5.3
  path_provider: ^2.1.6
  path: ^1.9.1
  image_picker: ^1.2.4
  file_picker: ^13.4.1
  archive: ^4.6.0
  share_plus: ^13.3.1

  # IDs & integrity checksums
  uuid: ^4.6.0
  crypto: ^3.0.6
  animations: 3.0.0
  flutter_animate: 4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.16.1
  drift_dev: ^2.35.3
  freezed: ^4.0.2
  json_serializable: ^6.15.2
  injectable_generator: ^3.1.3

  # Testing
  bloc_test: ^10.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/branding/logo/
    - assets/branding/splash/

  fonts:
    - family: NotoSansGujarati
      fonts:
        - asset: assets/fonts/NotoSansGujarati-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansGujarati-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansGujarati-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansGujarati-Bold.ttf
          weight: 700
